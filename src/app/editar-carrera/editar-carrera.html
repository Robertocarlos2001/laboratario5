<div class="container">
  <h2 class="text-center">{{ textoAccion }}</h2>
  <form class="form-group row">
    <div class="form-group col-md-3">
      <label for="nombre">Nombre</label>
      <input type="text" class="form-control" id="nombre" [(ngModel)]="cuadroNombre" name="nombre">
    </div>
    <div class="form-group col-md-3">
      <label for="codigo">Código</label>
      <input type="text" class="form-control" id="codigo" [(ngModel)]="cuadroCodigo" name="codigo">
    </div>
    <div class="form-group col-md-3">
      <label for="faculta">Facultad</label>
      <input type="text" class="form-control" id="faculta" [(ngModel)]="cuadroFaculta" name="faculta">
    </div>
    <div class="form-group col-md-3">
      <label for="duracion">Duración (años)</label>
      <input type="number" class="form-control" id="duracion" [(ngModel)]="cuadroDuracion" name="duracion">
    </div>
    <div class="form-group col-md-12">
      <button type="button" class="btn btn-outline-warning" (click)="accion_carrera()">{{ textoAccion }}</button>
    </div>
  </form>
  <div style="text-align: center;">
    <button class="btn btn-primary" (click)="volverHome()">Ir a Home</button>
  </div>
</div>
